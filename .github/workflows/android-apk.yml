name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'scripts/build_mobile_data.py'
      - 'scripts/intelligence/snapshots.py'
      - 'scripts/intelligence/storylines.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    if: github.repository == 'MDHaarith/PolInt-Sys'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Same key on every build, so phones accept each new APK as an update.
      - name: Install signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 secret not set; APK is signed with a throwaway key and won't update over a previous install."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore

      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build:mobile

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon

      # One rolling release keeps the download link fixed.
      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PolInt.apk
          notes="Build ${{ github.run_number }} from ${GITHUB_SHA::7}, $(date -u +%FT%TZ)"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest PolInt.apk --clobber
            gh release edit apk-latest --notes "$notes"
          else
            gh release create apk-latest PolInt.apk --title "PolInt for Android (latest build)" --notes "$notes"
          fi
